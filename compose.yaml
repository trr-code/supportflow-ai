name: lucid-local

x-app: &app
  image: lucid-local-app
  build:
    context: .
    target: runtime
  env_file: .env.docker
  environment: &environment
    APP_ENV: local
    APP_DEBUG: "false"
    APP_URL: http://localhost:8088
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_DATABASE: lucid_local
    DB_USERNAME: lucid
    DB_PASSWORD: ${LUCID_DB_PASSWORD:?Set LUCID_DB_PASSWORD in .env.docker}
    DB_URL: ""
    CACHE_STORE: database
    CACHE_PREFIX: lucid_docker_
    QUEUE_CONNECTION: database
    DB_QUEUE_RETRY_AFTER: "150"
    SESSION_DRIVER: database
    SESSION_DOMAIN: ""
    SESSION_SECURE_COOKIE: "false"
    MAIL_MAILER: log
    OCTANE_SERVER: frankenphp
    OCTANE_HTTPS: "false"
    XDG_CONFIG_HOME: /tmp/caddy-config
    XDG_DATA_HOME: /tmp/caddy-data
  volumes:
    - storage:/app/storage
    - cache:/app/bootstrap/cache
  restart: unless-stopped
  stop_grace_period: 120s
  init: true

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: lucid-local-postgres
    environment:
      POSTGRES_DB: lucid_local
      POSTGRES_USER: lucid
      POSTGRES_PASSWORD: ${LUCID_DB_PASSWORD:?Set LUCID_DB_PASSWORD in .env.docker}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U lucid -d lucid_local']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  init:
    <<: *app
    command: [migrate, --force, --no-interaction]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  app:
    <<: *app
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, php, -r, 'exit(@file_get_contents("http://127.0.0.1:8001/up") === false ? 1 : 0);']
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 6
  queue:
    <<: *app
    command: [queue:work, database, '--queue=ai,default', --sleep=3, --timeout=120, --tries=3, --memory=128]
    depends_on:
      init:
        condition: service_completed_successfully
  scheduler:
    <<: *app
    command: [schedule:work, --no-interaction]
    depends_on:
      init:
        condition: service_completed_successfully
  web:
    image: nginx:1.31.9@sha256:84f7876d21d154885f99554d7ae325d8c2213f9169726ea7ab60642f2573a787
    ports:
      - 127.0.0.1:8088:8080
    volumes:
      - ./docker-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
        restart: true
    restart: unless-stopped

  postgres-test:
    image: lucid-local-postgres
    profiles: [test]
    environment:
      POSTGRES_DB: supportflow_ai_testing
      POSTGRES_USER: testing
      POSTGRES_PASSWORD: testing
    volumes:
      - postgres-test:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U testing -d supportflow_ai_testing']
      interval: 5s
      timeout: 5s
      retries: 12
  test:
    image: lucid-local-test
    profiles: [test]
    build:
      context: .
      target: test
    env_file: .env.docker
    environment:
      TMPDIR: /test-locks
    volumes:
      - test-locks:/test-locks
    depends_on:
      postgres-test:
        condition: service_healthy
    entrypoint: [sh, -c]
    command:
      - composer test

volumes:
  postgres:
  storage:
  cache:
  postgres-test:
  test-locks:
