name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: testing
          POSTGRES_DB: supportflow_ai_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testing -d supportflow_ai_testing"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_pgsql
          coverage: none

      - name: Test deployment safety gate
        run: bash .github/forge-deploy-test.sh

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Fail on every advisory. Any temporary exception needs owner approval,
      # an advisory ID, a reason, and an expiry date in the reviewed change.
      - name: Audit Composer dependencies
        run: composer audit --locked --abandoned=fail

      - name: Copy environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Pint
        run: vendor/bin/pint --test

      - name: Run Rector
        run: vendor/bin/rector process --dry-run --no-progress-bar --output-format=github

      - name: Run Larastan
        run: vendor/bin/phpstan analyse --memory-limit=1G

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Node dependencies
        run: npm ci

      - name: Audit Node dependencies
        run: npm audit

      - name: Build frontend assets
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Pest
        run: php artisan test --exclude-group=stress --exclude-group=evals
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: supportflow_ai_testing
          DB_USERNAME: testing
          DB_PASSWORD: testing
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array

      - name: Upload browser screenshots and traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-tests
          path: |
            tests/Browser/Screenshots
            tests/Browser/Traces

  deploy:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: forge-production
      cancel-in-progress: false
    steps:
      - name: Deploy the tested commit to Forge
        env:
          FORGE_DEPLOY_HOOK: ${{ secrets.FORGE_DEPLOY_HOOK }}
        run: |
          test -n "$FORGE_DEPLOY_HOOK" || { echo "Missing Forge deploy hook."; exit 1; }
          curl --fail --silent --show-error --max-time 60 \
            --output /dev/null --get "$FORGE_DEPLOY_HOOK" \
            --data-urlencode "forge_deploy_branch=main" \
            --data-urlencode "forge_deploy_commit=$GITHUB_SHA" \
            --data-urlencode "ci_commit=$GITHUB_SHA"
